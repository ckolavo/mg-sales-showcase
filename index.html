<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#285c86"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-180.png"><style>body{margin:0;background:#fff}[hidden]{display:none!important}</style><title>Moody Gardens Sales Showcase</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Layout: blue side rail (sections) + item list + photo viewer. One deliberate light look in the Moody Gardens palette. */
:root{
  --blue:#285c86; --cyan:#06c0f2; --pink:#ec2c91; --green:#91c73f; --orange:#ff9d56;
  --ink:#1a1a1a; --muted:#4a4a4a; --paper:#ffffff; --wash:#f3f4f5; --line:#d9dcdf; --black:#000000;
  --font:"Raleway", "Segoe UI", Arial, sans-serif;
  --rail:132px; --list:288px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,select{font:inherit;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.app{display:flex;height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Rail */
.rail{width:var(--rail);flex-shrink:0;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 16px}
.brand{padding:0 12px 16px;border-bottom:1px solid rgba(255,255,255,.25);margin-bottom:8px;width:100%}
.brand img{width:100%;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.nav button{width:112px;min-height:76px;border:0;border-radius:20px;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;line-height:1.15;text-align:center;padding:8px 4px;cursor:pointer}
.nav button svg{width:32px;height:32px;overflow:visible}
.mgi{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mgi .a{fill:var(--cyan);stroke:none;opacity:.55}
.nav button[aria-current="page"] .mgi .a{opacity:.35}
.nav button[aria-current="page"]{background:#fff;color:var(--blue);font-weight:800}
.rail .stamp{margin-top:auto;font-size:11px;opacity:.8;text-align:center;padding:0 6px}
/* Short landscape screens (the tablet with Chrome's bars showing): tighten the rail so Present stays on screen */
.rail{overflow-y:auto;scrollbar-width:none}
@media (min-width:761px) and (max-height:900px){
  .rail{padding:12px 0 12px;gap:4px}
  .brand{padding:0 16px 10px;margin-bottom:4px}
  .nav{gap:4px}
  .nav button{min-height:62px;gap:4px;padding:6px 4px}
  .nav button svg{width:28px;height:28px}
  .rail .stamp{display:none}
  .presentbtn,.editbtn{min-height:40px}
  .presentbtn + .editbtn{margin-top:8px}
}
@media (min-width:761px) and (max-height:740px){
  .brand{padding:0 22px 8px}
  .nav button{min-height:54px;font-size:11px}
  .nav button svg{width:24px;height:24px}
}

/* Main */
.main{flex:1;min-width:0;display:flex;height:100%}
.view{flex:1;min-width:0;display:flex;height:100%}
.view[hidden]{display:none!important}

/* Home */
.home{flex-direction:column;padding:32px 36px 28px;gap:22px;overflow:auto}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.home h1{margin:6px 0 0;font-size:clamp(28px,3.4vw,42px);line-height:1.12;font-weight:800;color:var(--blue);text-wrap:balance;max-width:28ch}
.tiles{flex:1;min-height:420px;display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.tile{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;background:var(--wash);text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;inset:auto 0 0 0;padding:48px 20px 16px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72));color:#fff;font-weight:800;font-size:22px;line-height:1.15}
.tile small{display:block;font-weight:700;font-size:13px;opacity:.9;margin-top:4px}
.tile.big{grid-row:1 / 3}
.tile.big span{font-size:30px}

/* Collection: list + viewer */
.list{width:var(--list);flex-shrink:0;background:var(--wash);overflow:auto;padding:22px 14px 28px;border-right:1px solid var(--line)}
.list h2{margin:0 10px 14px;font-size:20px;font-weight:800;color:var(--blue)}
.grp{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);padding:16px 12px 6px}
.list button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:20px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.25;color:var(--ink);cursor:pointer}
.list button[aria-current="true"]{background:var(--blue);color:#fff;font-weight:800}
.picker{display:none}
.viewer{flex:1;min-width:0;display:flex;flex-direction:column;padding:20px 24px 18px;gap:12px}
.stage{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:#0d0d0d;touch-action:pan-y;user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .2s ease}
.stage.contain img{object-fit:contain;background:#fff}
.arrow{position:absolute;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:28px;border:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.arrow.prev{left:14px}.arrow.next{right:14px}
.arrow svg{width:26px;height:26px}
.count{position:absolute;right:14px;bottom:14px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700;padding:7px 13px;border-radius:20px}
.cap{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700;padding:7px 13px;border-radius:20px;max-width:60%}
.cap:empty{display:none}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.strip button{flex-shrink:0;width:104px;height:64px;padding:0;border:0;border-radius:8px;overflow:hidden;cursor:pointer;opacity:.7;background:var(--wash)}
.strip button img{width:100%;height:100%;object-fit:cover}
.strip button[aria-current="true"]{opacity:1;outline:3px solid var(--blue);outline-offset:2px}
.info{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.info-text{min-width:0;flex:1 1 420px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.info h1{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:800;color:var(--blue);line-height:1.15}
.facts{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 22px;font-size:15px;line-height:1.45;color:var(--muted)}
.facts li{display:flex;gap:8px;align-items:flex-start}
.facts svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.variants{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.variants button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.variants button[aria-pressed="true"]{background:var(--blue);color:#fff}
.variant-pick{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:20px;border:2px solid transparent;font-size:14px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.cyan{background:var(--cyan);color:#fff;text-shadow:0 1px 2px rgba(40,92,134,.75)}
.btn.cyan:hover{background:#fff;color:var(--cyan);border-color:var(--cyan);text-shadow:none}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn.pink{background:var(--pink);color:#fff}
.btn.pink:hover{background:#fff;color:var(--pink);border-color:var(--pink)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.links b{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-right:4px}
.links button{border:1px solid var(--pink);background:#fff;color:var(--pink);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.links button:hover{background:var(--pink);color:#fff}
.links:empty{display:none}

/* Tours */
.tours{flex-direction:column;padding:32px 36px;gap:20px;overflow:auto}
.tours h2{margin:0;font-size:clamp(26px,3vw,36px);font-weight:800;color:var(--blue)}
.note{margin:0;font-size:15px;color:var(--muted);max-width:62ch;line-height:1.5}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tcard{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--wash);text-decoration:none;color:var(--ink)}
.tcard .ph{position:relative;aspect-ratio:16/10;background:#ddd}
.tcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard .ph.plan img{object-fit:contain;background:#fff}
.tcard .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.tcard b{font-size:18px;font-weight:800;color:var(--blue)}
.tcard small{font-size:13px;font-weight:700;color:var(--muted)}
button.tcard{border:0;padding:0;font:inherit;text-align:left;cursor:pointer}
.tcard:hover b{color:var(--pink)}
.tgroup{display:flex;flex-direction:column;gap:14px}
.tgroup h3{margin:6px 0 0;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}

/* 360 viewer */
.pano{flex-direction:column;padding:20px 28px 22px;gap:14px;height:100%;min-height:0}
.phead{display:flex;align-items:center;gap:16px}
.phead .ptitle{flex:1;min-width:0}
.phead h2{margin:2px 0 0;font-size:clamp(22px,2.4vw,30px);font-weight:800;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstage{position:relative;flex:1;min-height:320px;border-radius:20px;overflow:hidden;background:#0d1b26}
#pano{position:absolute;inset:0}
.pstage .pscene{position:absolute;left:16px;bottom:16px;z-index:3;padding:8px 14px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700;pointer-events:none;max-width:calc(100% - 32px)}
.pstage .arrow{z-index:3;background:rgba(0,0,0,.42)}
.pstage .pmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;font-size:16px;font-weight:700;text-align:center;z-index:2}
.pstage .pmsg[hidden]{display:none}
.pstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pstrip button{flex:0 0 auto;width:150px;display:flex;flex-direction:column;gap:6px;border:0;padding:0;background:none;cursor:pointer;text-align:left;font:inherit}
.sheet{display:block;background-color:#0d1b26;background-repeat:no-repeat;background-origin:border-box}
.tcard .ph .sheet{position:absolute;inset:0}
.pstrip .sheet{width:150px;height:84px;border-radius:12px;border:3px solid transparent;box-sizing:border-box}
.pstrip span{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.25}
.pstrip button[aria-pressed="true"] .sheet{border-color:var(--cyan)}
.pstrip button[aria-pressed="true"] span{color:var(--blue)}
.pstrip:empty{display:none}
.pano.pfull{position:fixed;inset:0;z-index:50;background:#000;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pano.pfull .phead h2{color:#fff}
.pano.pfull .pstage{border-radius:0}
.pano.pfull .pstrip span{color:#cfd6dc}
.pano.pfull .pstrip button[aria-pressed="true"] span{color:#fff}
.pnlm-container{background:#0d1b26!important;font-family:var(--font)!important}
.pnlm-load-box{background-color:rgba(0,0,0,.55)!important;border-radius:20px!important}

/* Full screen viewer */
.fs{position:fixed;inset:0;background:#000;z-index:50;display:flex}
.fs[hidden]{display:none}
.fs img{width:100%;height:100%;object-fit:contain}
.fs .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:56px;height:56px;border-radius:28px;border:0;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fs .close svg{width:26px;height:26px}
.fs .arrow{background:rgba(255,255,255,.18)}
.fs .count{bottom:calc(14px + env(safe-area-inset-bottom,0px))}

/* Tablet portrait */
@media (max-width:1100px){
  :root{--rail:120px;--list:240px}
  .nav button{width:104px}
  .tiles{grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-rows:220px}
  .tile.big{grid-row:auto;grid-column:1 / 3}
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pano{padding:16px 18px 18px}
  .pstrip button,.pstrip .sheet{width:132px}
  .pstrip .sheet{height:74px}
}
/* Phone */
@media (max-width:760px){
  body{overflow:auto}
  .app{flex-direction:column-reverse;height:auto;min-height:100%}
  .rail{position:fixed;left:0;right:0;bottom:0;width:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
  .brand,.rail .stamp{display:none}
  .nav{flex-direction:row;justify-content:space-around}
  .nav button{width:auto;flex:1;min-height:58px;font-size:10.5px;border-radius:16px;padding:6px 2px}
  .nav button svg{width:28px;height:28px}
  .main{height:auto;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .view{flex-direction:column;height:auto}
  .home,.tours{padding:22px 16px}
  .tiles{grid-template-columns:1fr;grid-auto-rows:190px;min-height:0}
  .tile.big{grid-column:auto}
  .tgrid{grid-template-columns:1fr}
  .pano{padding:14px 12px 16px;height:calc(100vh - 80px - env(safe-area-inset-bottom,0px));height:calc(100dvh - 80px - env(safe-area-inset-bottom,0px))}
  .phead{gap:10px}
  .phead .btn{padding:10px 14px}
  .phead .fslabel{display:none}
  .pstage{min-height:240px}
  .pstrip button,.pstrip .sheet{width:112px}
  .pstrip .sheet{height:63px}
  .list{display:none}
  .picker{display:block;padding:16px 16px 0}
  .picker label{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .picker select,.variant-pick select{width:100%;min-height:48px;border:1px solid var(--blue);border-radius:20px;padding:10px 14px;background:#fff;font-weight:700;font-size:16px}
  .viewer{padding:12px 16px 20px}
  .stage{flex:none;aspect-ratio:4/3}
  .arrow{width:46px;height:46px;margin-top:-23px}
  .variants{display:none}
  .variant-pick{display:block;margin-top:6px}
  .actions,.actions .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){.stage img{transition:none}}

/* Edit mode (editors only) */
.editbtn{margin-top:auto;width:112px;min-height:44px;border:1px solid rgba(255,255,255,.55);border-radius:20px;background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.editbtn svg{width:16px;height:16px}
.editbtn[aria-pressed="true"]{background:#fff;color:var(--blue)}
.editbtn + .stamp{margin-top:10px}
.presentbtn{margin-top:auto;width:112px;min-height:44px;border:0;border-radius:20px;background:var(--cyan);color:#fff;text-shadow:0 1px 2px rgba(40,92,134,.75);font:inherit;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.presentbtn svg{width:16px;height:16px}
.presentbtn[aria-pressed="true"]{background:#fff;color:var(--blue);text-shadow:none}
.presentbtn + .editbtn,.presentbtn + .stamp{margin-top:10px}
.presentbtn[hidden] + .editbtn{margin-top:auto}
.ostat{margin-top:auto;width:112px;font-size:11px;font-weight:700;line-height:1.3;text-align:center;color:#fff;opacity:.9}
.ostat b{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.presentbtn:not([hidden]) ~ .ostat,.editbtn:not([hidden]) ~ .ostat{margin-top:10px}
.ostat + .stamp{margin-top:8px}
.ebar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:#fff;border:2px solid var(--blue);border-radius:20px;padding:8px 10px 8px 18px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:calc(100vw - 24px)}
.ebar .etitle{font-weight:800;color:var(--blue);font-size:14px}
.ebar .estat{font-size:14px;color:var(--muted);max-width:360px}
.ebar .btn{min-height:40px;padding:8px 16px;font-size:13px}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn.ghost:hover{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff;text-shadow:0 1px 2px rgba(40,92,134,.6)}
.btn.green:hover{background:#fff;color:var(--blue);border-color:var(--green);text-shadow:none}
.btn[disabled]{opacity:.5;cursor:default}
.etools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.etools .btn{min-height:40px;padding:8px 16px;font-size:13px}
.erow{display:flex;align-items:center;gap:4px}
.erow > button[data-id]{flex:1;min-width:0}
.erow.hid > button[data-id]{opacity:.45;text-decoration:line-through}
.ectl{display:flex;gap:2px;flex-shrink:0}
.ectl button,.ethc button{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ectl button svg,.ethc button svg{width:16px;height:16px}
.ectl button:hover,.ethc button:hover{border-color:var(--blue)}
.addspace{margin:14px 10px 0;width:calc(100% - 20px)!important;border:2px dashed var(--blue)!important;color:var(--blue)!important;text-align:center!important;font-weight:800!important}
.strip.editing{padding-bottom:4px}
.eth{position:relative;flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.eth > button[data-i]{opacity:1}
.ethc{display:flex;gap:3px}
.eth .cover{position:absolute;left:4px;top:4px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:10px;pointer-events:none}
.count:empty{display:none}
.strip .ethc button{opacity:1;width:30px;height:30px;border-radius:15px;overflow:visible}
.strip .addph{opacity:1;flex-shrink:0;width:104px;height:64px;border:2px dashed var(--blue);border-radius:8px;background:#fff;color:var(--blue);font-weight:800;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addph svg{width:20px;height:20px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;text-align:center;padding:20px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.mbox h3{margin:0;font-size:22px;font-weight:800;color:var(--blue)}
.mbox label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.mbox input,.mbox textarea,.mbox select{font:inherit;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.mbox textarea{min-height:140px;resize:vertical}
.mbox small{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.mact{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.mact .btn{min-height:44px}
.merr{margin:0;color:var(--pink);font-weight:700;font-size:14px}
.mbox p{margin:0 0 4px;font-size:14px;line-height:1.5;color:var(--muted)}
@media (max-width:760px){.editbtn,.presentbtn,.ostat{display:none!important}}

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><img src="img/mg-logo-white.png" alt="Moody Gardens, Galveston Island. Hotel, Spa &amp; Convention Center, Attractions, Golf Course"></div>
    <div class="nav" id="nav"></div>
    <button type="button" class="presentbtn" id="presentBtn" aria-pressed="false" hidden></button>
    <button type="button" class="editbtn" id="editBtn" hidden aria-pressed="false"></button>
    <div class="ostat" id="ostat" hidden role="status" aria-live="polite"></div>
    <div class="stamp">Photos updated October 2026</div>
  </nav>
  <main class="main">
    <section class="view home" id="v-home" aria-label="Home"></section>
    <section class="view coll" id="v-coll" hidden>
      <div class="list" id="list"></div>
      <div class="viewer">
        <div class="picker"><label for="pick">Choose a space</label><select id="pick"></select></div>
        <div class="stage" id="stage">
          <img id="photo" alt=""><div class="empty" id="empty" hidden>No photos yet</div>
          <button class="arrow prev" id="prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="arrow next" id="next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
          <div class="cap" id="cap"></div>
          <div class="count" id="count"></div>
        </div>
        <div class="strip" id="strip" aria-label="Photos"></div>
        <div class="info">
          <div class="info-text">
            <div class="eyebrow" id="eyebrow"></div>
            <h1 id="title"></h1>
            <ul class="facts" id="facts"></ul>
            <div class="variants" id="variants" role="group" aria-label="Room options"></div>
            <div class="links" id="links"></div>
            <div class="etools" id="etools" hidden></div>
            <div class="variant-pick" id="variantPickWrap"><select id="variantPick" aria-label="Room options"></select></div>
          </div>
          <div class="actions" id="actions"></div>
        </div>
      </div>
    </section>
    <section class="view tours" id="v-tours" hidden aria-label="360° Tours"></section>
    <section class="view pano" id="v-pano" hidden aria-label="360° tour">
      <div class="phead">
        <button type="button" class="btn ghost" id="pBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
        <div class="ptitle"><div class="kicker" id="pWhere"></div><h2 id="pName"></h2></div>
        <button type="button" class="btn blue" id="pFs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="fslabel">Full screen</span></button>
      </div>
      <div class="pstage" id="pStage">
        <div id="pano"></div>
        <div class="pmsg" id="pMsg" hidden></div>
        <button class="arrow prev" id="pPrev" aria-label="Previous scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="arrow next" id="pNext" aria-label="Next scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
        <div class="pscene" id="pScene"></div>
      </div>
      <div class="pstrip" id="pStrip" aria-label="Scenes"></div>
    </section>
  </main>
</div>
<div class="ebar" id="ebar" hidden role="status" aria-live="polite">
  <span class="etitle">Edit mode</span><span class="estat" id="estat"></span>
  <button type="button" class="btn ghost" id="eDiscard">Discard</button>
  <button type="button" class="btn green" id="eSave">Save</button>
  <button type="button" class="btn blue" id="eDone">Done</button>
</div>
<div class="modal" id="modal" hidden><form class="mbox" id="mform"></form></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<div class="fs" id="fs" hidden>
  <img id="fsPhoto" alt="">
  <button class="arrow prev" id="fsPrev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="arrow next" id="fsNext" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="count" id="fsCount"></div>
  <button class="close" id="fsClose" aria-label="Close full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

// Tours: 360° panoramas play inside the app (Pannellum), never in a new tab
const TOUR_GROUPS = [['meet', 'Meeting and event spaces'], ['venue', 'Attraction venues'], ['room', 'Rooms & Suites']];
function tourById(id){ return (DATA.tours || []).find(t => t.id === id && t.scenes); }
function renderTours(){
  const ts = (DATA.tours || []).filter(t => t.scenes);
  $('v-tours').innerHTML = `

// Each tour has one image sheet: a 16:9 frame per scene, side by side. Frame 0 is the card.
function sheetStyle(t, i){
  const n = t.scenes.length;
  return `background-image:url('${src(t.sheet)}');background-size:${n * 100}% 100%;background-position:${n > 1 ? (i / (n - 1)) * 100 : 0}% 0`;
}
// The scene that matches a room option, so "Open 360 tour" starts in the right room
function tourScene(t, label){ const i = label ? t.scenes.findIndex(sc => sc.title === label) : -1; return i < 0 ? 0 : i; }

const PANO = {tour:null, scene:0, viewer:null, lib:null, back:'tours'};
const PNLM = 'vendor/pannellum';
function loadPannellum(){
  if (window.pannellum) return Promise.resolve();
  if (PANO.lib) return PANO.lib;
  PANO.lib = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = PNLM + '.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = PNLM + '.js'; sc.onload = res;
    sc.onerror = () => { PANO.lib = null; sc.remove(); rej(new Error('pannellum')); };
    document.head.appendChild(sc);
  });
  return PANO.lib;
}
function curHash(){
  const id = state.section;
  if (id === 'home' || id === 'tours') return id;
  const it = state.item[id];
  return id + (it ? '/' + it + (state.variant ? '/' + state.variant : '') : '');
}
function pMsg(t){ $('pMsg').textContent = t || ''; $('pMsg').hidden = !t; }
function openTour(id, scene, fromHash){
  const t = tourById(id);
  if (!t){ go('tours', fromHash); return; }
  if (state.section !== 'tour'){
    PANO.back = fromHash && state.section === 'home' && !PANO.tour ? 'tours' : curHash();
    if (OFFLINE_APP && !fromHash){ try { history.pushState(null, '', '#tour/' + id); } catch (err) {} }
  }
  state.section = 'tour';
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.s === 'tours' ? 'page' : 'false'));
  ['v-home', 'v-tours', 'v-coll'].forEach(v => { $(v).hidden = true; });
  $('v-pano').hidden = false;
  const fresh = PANO.tour !== t;
  PANO.tour = t;
  $('pName').textContent = t.name; $('pWhere').textContent = t.where;
  $('pStrip').innerHTML = t.scenes.length > 1 ? t.scenes.map((sc, i) => `<button type="button" data-scene="${i}" aria-pressed="false"><i class="sheet" style="${sheetStyle(t, i)}"></i><span>${esc(sc.title)}</span></button>`).join('') : '';
  $('pPrev').hidden = $('pNext').hidden = t.scenes.length < 2;
  if (fresh && PANO.viewer){ try { PANO.viewer.destroy(); } catch (err) {} PANO.viewer = null; }
  showScene(+scene || 0, fromHash);
  window.scrollTo(0, 0);
}
function showScene(i, fromHash){
  const t = PANO.tour, n = t.scenes.length;
  i = ((i % n) + n) % n; PANO.scene = i;
  const sc = t.scenes[i];
  $('pScene').textContent = sc.title + (n > 1 ? '  (' + (i + 1) + ' of ' + n + ')' : '');
  $('pStrip').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.scene === i)));
  const cur = $('pStrip').querySelector('[aria-pressed="true"]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest', inline:'center'});
  if (!fromHash){ try { history.replaceState(null, '', '#tour/' + t.id + (i ? '/' + i : '')); } catch (err) {} }
  if (!window.pannellum) pMsg('Loading the tour');
  loadPannellum().then(() => {
    if (PANO.tour !== t || PANO.scene !== i) return;
    pMsg('');
    if (PANO.viewer){ PANO.viewer.loadScene('s' + i, -4, 0, 100); return; }
    const scenes = {};
    t.scenes.forEach((x, k) => { scenes['s' + k] = {panorama: src(x.img)}; });
    PANO.viewer = pannellum.viewer('pano', {
      default: {firstScene: 's' + i, type: 'equirectangular', autoLoad: true, sceneFadeDuration: 500,
        showControls: false, keyboardZoom: true, mouseZoom: true, compass: false,
        hfov: 100, minHfov: 45, maxHfov: 120, pitch: -4, yaw: 0, friction: 0.2,
        autoRotate: -2, autoRotateInactivityDelay: 6000, strings: {loadingLabel: 'Loading the view'}},
      scenes: Object.fromEntries(Object.entries(scenes).map(([k, v]) => [k, Object.assign({type: 'equirectangular'}, v)]))
    });
  }).catch(() => pMsg('The 360 viewer could not load. Check the Wi-Fi or hotspot connection, then try again.'));
}
function closeTour(){
  exitPfull();
  if (PANO.viewer){ try { PANO.viewer.destroy(); } catch (err) {} PANO.viewer = null; }
  PANO.tour = null;
  $('v-pano').hidden = true;
}
function exitPfull(){
  $('v-pano').classList.remove('pfull');
  if (document.fullscreenElement === $('v-pano')){ try { document.exitFullscreen(); } catch (err) {} }
}
$('pBack').addEventListener('click', () => { const b = PANO.back || 'tours'; route(b); });
$('pPrev').addEventListener('click', () => showScene(PANO.scene - 1));
$('pNext').addEventListener('click', () => showScene(PANO.scene + 1));
$('pStrip').addEventListener('click', e => { const b = e.target.closest('[data-scene]'); if (b) showScene(+b.dataset.scene); });
$('pFs').addEventListener('click', () => {
  const v = $('v-pano');
  if (v.classList.contains('pfull')){ exitPfull(); }
  else {
    v.classList.add('pfull');
    PANO.fsReal = !document.fullscreenElement && !!v.requestFullscreen;
    if (PANO.fsReal){ try { const p = v.requestFullscreen(); if (p && p.catch) p.catch(() => { PANO.fsReal = false; }); } catch (err) { PANO.fsReal = false; } }
  }
  setTimeout(() => { if (PANO.viewer) PANO.viewer.resize(); }, 120);
});
document.addEventListener('fullscreenchange', () => {
  if (PANO.fsReal && document.fullscreenElement !== $('v-pano')){ PANO.fsReal = false; $('v-pano').classList.remove('pfull'); }
  if (PANO.viewer) setTimeout(() => PANO.viewer.resize(), 120);
});
// Present: one tap puts the whole app in full screen (hides Chrome's bars and the Claude bar)
(function(){
  const b = $('presentBtn'), de = document.documentElement;
  if (!de.requestFullscreen || document.fullscreenEnabled === false) return;
  if (window.matchMedia && matchMedia('(display-mode: fullscreen)').matches) return;
  const ON = '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', OFF = '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';
  function upd(){ const on = !!document.fullscreenElement; b.setAttribute('aria-pressed', String(on)); b.innerHTML = svg(on ? OFF : ON, 2.2) + (on ? 'Exit' : 'Present'); }
  b.addEventListener('click', () => {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : de.requestFullscreen({navigationUI: 'hide'});
      if (p && p.catch) p.catch(() => {});
    } catch (err) {}
  });
  document.addEventListener('fullscreenchange', upd);
  upd(); b.hidden = false;
})();

// Views: which view a room option shows, and which room options share a view
function viewFor(it, v){
  if (it.view) return it.view === 'balcony' ? 'pyramid' : it.view;
  const label = v ? v.label : '';
  if (/Pyramid View/.test(label)) return 'pyramid';
  if (/Island View/.test(label)) return 'island';
  if (/Bayou View/.test(label)) return 'bayou';
  if (/Property View/.test(label)) return 'property';
  return null;
}
function roomsWithView(id){
  const out = [];
  for (const it of DATA.rooms){
    if (it.variants) it.variants.forEach((v, i) => { if (viewFor(it, v) === id) out.push({item:it.id, variant:i, label:it.name + ', ' + v.label}); });
    else if (viewFor(it) === id) out.push({item:it.id, variant:0, label:it.name});
  }
  return out;
}

// Collection view
const stage = $('stage'), photo = $('photo');
function allItems(){ return DATA[state.section] || []; }
function items(){ const a = allItems(); return EDIT.on ? a : a.filter(i => !i.hidden); }
function cur(){ const list = items(); return list.find(i => i.id === state.item[state.section]) || list[0] || {id:'', name:'', group:'', photos:[]}; }
function photos(){ const it = cur(); const v = it.variants && it.variants[state.variant]; const p = v ? v.photos : it.photos; return p || (v ? (v.photos = []) : (it.photos = [])); }

function renderList(){
  const sec = SECTIONS.find(s => s.id === state.section);
  let html = `<h2>${sec.title}</h2>`, last = null, opts = '', og = null;
  for (const it of items()){
    if (it.group !== last){ html += `<div class="grp">${esc(it.group)}</div>`; last = it.group;
      if (og !== null) opts += '</optgroup>'; opts += `<optgroup label="${esc(it.group)}">`; og = it.group; }
    const b = `<button type="button" data-id="${it.id}" aria-current="${it.id === cur().id}">${esc(it.name)}</button>`;
    html += EDIT.on ? `<div class="erow${it.hidden ? ' hid' : ''}">${b}<span class="ectl">
      <button type="button" data-mv="-1" data-mid="${it.id}" aria-label="Move ${esc(it.name)} up">${svg('<path d="M6 15l6-6 6 6"/>', 2.4)}</button>

function renderItem(){
  const it = cur();
  $('eyebrow').textContent = it.eyebrow || it.group;
  $('title').textContent = it.name;
  const check = svg('<path d="M5 12l5 5 9-10"/>', 3).replace('stroke="currentColor"', 'stroke="#91c73f"');

  $('variants').innerHTML = vs.map((v, i) => `<button type="button" data-v="${i}" aria-pressed="${i === state.variant}">${esc(v.label)}</button>`).join('');
  $('variantPick').innerHTML = vs.map((v, i) => `<option value="${i}"${i === state.variant ? ' selected' : ''}>${esc(v.label)}</option>`).join('');

    const rs = roomsWithView(it.id);

  }
  $('links').innerHTML = links;

  else if (it.tour && /^https?:/.test(it.tour)) acts += `<a class="btn cyan" href="${esc(it.tour)}" target="_blank" rel="noopener">${svg(ICONS.tours, 2.2)}${it.id === 'plans' ? 'Interactive floor plans' : 'Open 360 tour'}</a>`;
  acts += `<button type="button" class="btn blue" id="fsBtn">${svg('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', 2.2)}Full screen</button>`;
  $('actions').innerHTML = acts;
  stage.classList.toggle('contain', it.fit === 'contain');
  renderTools();
  renderStrip(); show(0);
}
function renderStrip(){
  const ps = photos();
  $('strip').classList.toggle('editing', EDIT.on);

      </span></div>`).join('') + `<button type="button" class="addph" id="addPh">${svg('<path d="M12 5v14M5 12h14"/>', 2.4)}Add photos</button>`;
}
function show(i){
  const ps = photos(); const n = ps.length;
  $('empty').hidden = n > 0; photo.hidden = n === 0;
  if (!n){ state.idx = 0; photo.removeAttribute('src'); $('count').textContent = ''; $('cap').textContent = ''; $('prev').hidden = $('next').hidden = true; $('strip').hidden = !EDIT.on; $('empty').textContent = EDIT.on ? 'No photos yet. Use Add photos below.' : 'Photos coming soon'; return; }
  state.idx = (i + n) % n;
  photo.src = src(ps[state.idx]);
  photo.alt = cur().name + ', photo ' + (state.idx + 1);
  $('count').textContent = (state.idx + 1) + ' of ' + n;
  const caps = cur().caps; $('cap').textContent = caps && !cur().variants ? (caps[state.idx] || '') : '';
  $('prev').hidden = $('next').hidden = n < 2;
  $('strip').hidden = n < 2 && !EDIT.on;
  [...$('strip').children].forEach((b, k) => b.setAttribute('aria-current', k === state.idx));
  const active = $('strip').children[state.idx]; if (active) active.scrollIntoView({block:'nearest', inline:'nearest'});
  [1, -1].forEach(d => { const im = new Image(); im.src = src(ps[(state.idx + d + n) % n]); });
  if (!$('fs').hidden) fsShow();
}
$('list').addEventListener('click', e => {

  const b = e.target.closest('button[data-id]'); if (b) selectItem(b.dataset.id);
});

// Swipe on the photo
function swipe(el, onLeft, onRight){
  let x0 = null, y0 = null;
  el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? onLeft : onRight)();
  });
  el.addEventListener('pointercancel', () => { x0 = null; });
}

// Routing
function route(hash, fromHash){
  const [id, item, variant] = String(hash || '').split('/');
  if (id === 'tour'){ openTour(item, +variant || 0, fromHash); return; }
  go(id, fromHash, item, +variant || 0);
}
function go(id, fromHash, item, variant){
  if (!SECTIONS.some(s => s.id === id)) id = 'home';
  if (state.section === 'tour') closeTour();
  state.section = id; state.variant = 0;
  if (item && (DATA[id] || []).some(i => i.id === item)){ state.item[id] = item; state.variant = variant || 0; }
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.s === id ? 'page' : 'false'));
  $('v-home').hidden = id !== 'home';
  $('v-tours').hidden = id !== 'tours';
  $('v-coll').hidden = id === 'home' || id === 'tours';
  if (!$('v-coll').hidden){ renderList(); renderItem(); }
  if (!fromHash){ try { history[OFFLINE_APP ? 'pushState' : 'replaceState'](null, '', id === 'home' ? location.pathname + location.search : '#' + id + (item ? '/' + item + (state.variant ? '/' + state.variant : '') : '')); } catch (err) {} }
  window.scrollTo(0, 0);
}

const SKEL_HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';

function moveItem(id, dir){
  const a = allItems(); const i = a.findIndex(x => x.id === id); if (i < 0) return;
  let j = i + dir;
  while (j >= 0 && j < a.length && a[j].group !== a[i].group) j += dir;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; changed(); renderList();
}
function toggleHide(id){
  const it = allItems().find(x => x.id === id); if (!it) return;
  if (it.hidden) delete it.hidden; else it.hidden = true;
  changed(); renderList(); renderTools();
}
function movePhoto(i, dir){
  const ps = photos(); if (i < 0 || i >= ps.length) return;
  const j = dir === -999 ? 0 : i + dir; if (j < 0 || j >= ps.length || j === i) return;
  const [p] = ps.splice(i, 1); ps.splice(j, 0, p);
  changed(); renderStrip(); show(j);
}
function removePhoto(i){
  const ps = photos(); if (i < 0 || i >= ps.length) return;
  ps.splice(i, 1); changed(); renderStrip(); show(Math.min(i, ps.length - 1));
}

// Photos: resized on this device to 2000px on the long side, saved as WebP (JPEG if WebP is unavailable)
async function loadBitmap(file){
  if (window.createImageBitmap){ try { return await createImageBitmap(file); } catch (err) {} }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('decode')); im.src = u; });
}
async function prepPhoto(file){
  const bmp = await loadBitmap(file);
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, 2000 / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.82));
  let ext = 'webp';
  if (!blob || blob.type !== 'image/webp'){ blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)); ext = 'jpg'; }
  return {blob, ext};
}
$('filePick').addEventListener('change', async e => {
  const files = [...(e.target.files || [])]; e.target.value = '';
  if (!files.length || !EDIT.on) return;
  const ps = photos(); let added = 0, failed = 0;
  setStatus('Preparing ' + files.length + (files.length === 1 ? ' photo…' : ' photos…'));
  for (const f of files){
    try {
      const {blob, ext} = await prepPhoto(f);
      const path = 'local:' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      EDIT.uploads[path] = blob; SRC[path] = URL.createObjectURL(blob); ps.push(path); added++;
    } catch (err) { failed++; }
  }
  if (added){ EDIT.dirty += added; }
  updateBar();
  if (failed) setStatus(failed + (failed === 1 ? ' photo' : ' photos') + " couldn't be read. Use JPG, PNG or WebP files.");
  renderStrip(); show(ps.length - 1);
});

async function save(){
  if (OFFLINE_APP) return ghSave();
  if (!EDIT.dirty || EDIT.saving || !EDIT.art) return;
  EDIT.saving = true; updateBar(); setStatus('Saving…');
  try {
    // 1. Upload new photos that are still in use, then point the data at their permanent addresses
    let json = JSON.stringify(DATA);
    const pending = Object.keys(EDIT.uploads).filter(p => json.includes('"' + p + '"'));
    if (pending.length && !EDIT.assets) throw {code: 'no_assets'};
    let k = 0;
    for (const p of pending){
      setStatus('Uploading photo ' + (++k) + ' of ' + pending.length + '…');
      const r = await EDIT.assets.upload(EDIT.uploads[p]);
      const perm = '/_blob/' + r.id;
      SRC[perm] = SRC[p]; json = json.split('"' + p + '"').join('"' + perm + '"');
      delete EDIT.uploads[p];
    }
    DATA = JSON.parse(json);
    DATA.rev = Date.now();
    setStatus('Saving…');
    // 2. Save the content file. If this view can't publish files (for example on a public link), save the whole page instead.
    try { await EDIT.art.publish({'data/showcase.json': {content: JSON.stringify(DATA), contentType: 'application/json'}}); }
    catch (x) {
      if (!x || !['capability_disabled', 'capability_removed'].includes(x.code)) throw x;
      EDIT.dirty = 0; // the page reloads to the new version after this publish
      await EDIT.art.publish(buildPage());
    }
    EDIT.saving = false; EDIT.uploads = {}; EDIT.dirty = 0; EDIT.snapshot = clone(DATA); updateBar();
    setStatus('Saved. Every tablet shows this the next time the app opens.');
  } catch (err) {
    EDIT.saving = false; updateBar();
    const code = (err && err.code) || 'upstream_error';
    if (code === 'conflict') setStatus('A newer version was saved first. The app is reloading to it, so these changes were not saved.');
    else if (code === 'too_large' || code === 'too_large_file' || code === 'quota_exceeded') setStatus('That save is too large. Try fewer or smaller photos.');
    else if (code === 'rate_limited') setStatus('Saving too often. Wait a minute, then save again.');
    else if (code === 'no_assets') setStatus('Photo uploads are not available in this view. Open the app in Claude as an editor.');
    else if (['not_writer', 'not_granted', 'not_declared', 'capability_disabled', 'capability_removed', 'consent_required'].includes(code)){
      setStatus('Saving is not available in this view. Open the app in Claude, signed in as an editor.');
      $('eSave').disabled = true;
    }
    else setStatus("Couldn't save. Check the connection and try again.");
  }
}

async function initEdit(){

    if (!AUTH || !(window.crypto && crypto.subtle)) return;
    $('editBtn').innerHTML = svg(LOCK, 2) + 'Sign in';

}

// ---------- Editor sign-in and saving to GitHub (installable build only) ----------
// The page checks the password against a PBKDF2 hash (the password itself is never stored).
// Saving needs a GitHub fine-grained token for this one repo. It is pasted once per device and kept
// in this browser only, encrypted with a key derived from the password.
const LOCK = '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
const GH = {owner: 'ckolavo', repo: 'mg-sales-showcase', branch: 'main', token: null};
const TOKEN_KEY = 'mgss.gh';
const enc = new TextEncoder();
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function toB64(buf){ const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function pbkdf2(pass, salt, iter, usage){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
  if (usage === 'aes') return crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, base, 256));
}
async function checkPassword(user, pass){
  if (!AUTH || user.trim().toLowerCase() !== AUTH.user) return false;
  const h = await pbkdf2(pass, fromB64(AUTH.salt), AUTH.iter);
  return toB64(h) === AUTH.hash;
}
async function storeToken(token, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await pbkdf2(pass, salt, 200000, 'aes');
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, enc.encode(token));
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({salt: toB64(salt), iv: toB64(iv), ct: toB64(ct)})); } catch (err) {}
}
async function loadToken(pass){
  let rec = null; try { rec = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch (err) {}
  if (!rec) return null;
  try {
    const key = await pbkdf2(pass, fromB64(rec.salt), 200000, 'aes');
    return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(rec.iv)}, key, fromB64(rec.ct)));
  } catch (err) { return null; }
}
function forgetToken(){ GH.token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (err) {} }
function openLogin(){
  openModal('Editor sign in', `
    <label>Username<input name="user" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label>Password<input name="pass" type="password" required autocomplete="current-password"></label>
    <p class="merr" id="lerr" hidden></p>`, 'Sign in', fd => {
      const user = String(fd.get('user') || ''), pass = String(fd.get('pass') || '');
      const err = $('lerr'); err.hidden = true;
      const btn = $('mform').querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';
      checkPassword(user, pass).then(async ok => {
        btn.disabled = false; btn.textContent = 'Sign in';
        if (!ok){ err.textContent = 'That username or password is not right.'; err.hidden = false; return; }
        EDIT.unlocked = true; EDIT.pass = pass;
        GH.token = await loadToken(pass);
        closeModal();
        setEditing(true);
        setStatus(GH.token ? 'Signed in. Changes save to every tablet.' : 'Signed in. The first Save asks you to connect GitHub on this device.');
      });
      return false;
    });
}
function connectGitHub(then){
  openModal('Connect GitHub on this device', `
    <p>Saving publishes your changes to every tablet through GitHub. Paste your fine-grained access token for the <b>mg-sales-showcase</b> repo (Contents: Read and write). You only do this once on each device.</p>
    <label>Access token<input name="tok" type="password" required autocomplete="off" spellcheck="false" placeholder="github_pat_..."></label>
    <p class="merr" id="terr" hidden></p>`, 'Connect and save', fd => {
      const tok = String(fd.get('tok') || '').trim(); const err = $('terr'); err.hidden = true;
      const btn = $('mform').querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';
      fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo, {headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tok}})
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(async repo => {
          if (!repo.permissions || !repo.permissions.push) throw 'push';
          GH.token = tok; await storeToken(tok, EDIT.pass); closeModal(); then();
        })
        .catch(code => {
          btn.disabled = false; btn.textContent = 'Connect and save';
          err.textContent = code === 'push' ? 'That token can read the repo but not save to it. Give it Contents: Read and write.'
            : code === 401 ? 'GitHub did not accept that token. Check that you copied all of it.'
            : code === 404 ? "That token can't see the mg-sales-showcase repo. Add the repo to the token's access."
            : "Couldn't reach GitHub. Check the internet connection.";
          err.hidden = false;
        });
      return false;
    });
}
async function gh(path, opt){
  opt = opt || {};
  const r = await fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + path, Object.assign({}, opt, {headers: Object.assign({
    'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + GH.token, 'X-GitHub-Api-Version': '2022-11-28'},
    opt.body ? {'Content-Type': 'application/json'} : {})}));
  if (!r.ok){ const e = new Error('github'); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function ghSave(){
  if (!EDIT.dirty || EDIT.saving) return;
  if (!navigator.onLine){ setStatus('Connect to the internet to save. Your changes stay here until you save or discard them.'); return; }
  if (!GH.token){ connectGitHub(ghSave); return; }
  EDIT.saving = true; updateBar(); setStatus('Saving…');
  try {
    let json = JSON.stringify(DATA);
    const pending = Object.keys(EDIT.uploads).filter(p => json.includes('"' + p + '"'));
    const tree = [], newFiles = {}, toCache = [];
    let k = 0;
    for (const p of pending){
      setStatus('Uploading photo ' + (++k) + ' of ' + pending.length + '…');
      const blob = EDIT.uploads[p], buf = await blob.arrayBuffer();
      const h = hex(await crypto.subtle.digest('SHA-1', buf)).slice(0, 12);
      const path = 'img/u/' + h + (blob.type === 'image/webp' ? '.webp' : '.jpg');
      const b = await gh('/git/blobs', {method: 'POST', body: JSON.stringify({content: toB64(buf), encoding: 'base64'})});
      tree.push({path, mode: '100644', type: 'blob', sha: b.sha}); newFiles[path] = h; toCache.push([path, blob]);
      SRC[path] = SRC[p]; json = json.split('"' + p + '"').join('"' + path + '"');
    }
    const next = JSON.parse(json); next.rev = Date.now();
    const dataStr = JSON.stringify(next);
    newFiles['data/showcase.json'] = hex(await crypto.subtle.digest('SHA-1', enc.encode(dataStr))).slice(0, 12);
    setStatus('Saving…');
    for (let attempt = 0; ; attempt++){
      const head = (await gh('/git/ref/heads/' + GH.branch)).object.sha;
      const commit = await gh('/git/commits/' + head);
      const fj = await gh('/contents/files.json?ref=' + head);
      const list = JSON.parse(new TextDecoder().decode(fromB64(fj.content.replace(/\s/g, ''))));
      Object.assign(list.files, newFiles); list.built = Date.now(); list.rev = next.rev;
      const t = await gh('/git/trees', {method: 'POST', body: JSON.stringify({base_tree: commit.tree.sha, tree: tree.concat([
        {path: 'data/showcase.json', mode: '100644', type: 'blob', content: dataStr},
        {path: 'files.json', mode: '100644', type: 'blob', content: JSON.stringify(list)}])})});
      const c = await gh('/git/commits', {method: 'POST', body: JSON.stringify({message: 'Edit from the Sales Showcase app', tree: t.sha, parents: [head]})});
      try { await gh('/git/refs/heads/' + GH.branch, {method: 'PATCH', body: JSON.stringify({sha: c.sha})}); break; }
      catch (e){ if (e.status !== 422 || attempt >= 2) throw e; }
    }
    // Keep this tablet's offline copy current right away
    try {
      const cache = await caches.open(OCACHE);
      for (const [p, b] of toCache) await cache.put(new URL(p, location.href).href, new Response(b, {headers: {'Content-Type': b.type}}));
      await cache.put(new URL('data/showcase.json', location.href).href, new Response(dataStr, {headers: {'Content-Type': 'application/json'}}));
    } catch (err) {}
    DATA = next;
    EDIT.saving = false; EDIT.uploads = {}; EDIT.dirty = 0; EDIT.snapshot = clone(DATA); updateBar();
    setStatus('Saved. Other tablets get it the next time they open the app online, about 2 minutes from now.');
  } catch (err) {
    EDIT.saving = false; updateBar();
    const st = err && err.status;
    if (st === 401){ forgetToken(); setStatus('GitHub no longer accepts the saved token (it may have expired). Save again to connect a new one.'); }
    else if (st === 403 || st === 404){ forgetToken(); setStatus("The token can't save to the repo. Save again and connect a token with Contents: Read and write."); }
    else setStatus("Couldn't save. Check the internet connection and try again. Your changes are still here.");
  }
}

// ---------- Offline (installable build only) ----------
// sw.js serves files from the tablet's cache. offlineSync() saves every file listed in files.json,
// and on later launches with internet downloads only the files that changed.
const OCACHE = 'mg-showcase';
function oStat(html){ const o = $('ostat'); o.innerHTML = html; o.hidden = !html; }
async function offlineSync(){
  if (!('caches' in window)) return;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) {}
  const c = await caches.open(OCACHE);
  const abs = p => new URL(p, location.href).href;
  const prevR = await c.match(abs('__files'));
  const prev = prevR ? await prevR.json() : {files:{}};
  let list;
  try { const r = await fetch('files.json', {cache: 'no-store'}); if (!r.ok) throw 0; list = await r.json(); }
  catch (err) { oStat(prevR ? '<b>Offline</b>Showing the saved copy' : 'Connect to the internet once to save the app'); return; }
  const have = new Set((await c.keys()).map(q => q.url));
  const todo = Object.keys(list.files).filter(p => prev.files[p] !== list.files[p] || !have.has(abs(p)));
  let done = 0, failed = 0;
  const show = () => { if (todo.length) oStat('<b>Saving</b>' + Math.round(done / todo.length * 100) + '% for offline'); };
  show();
  const queue = todo.slice();
  async function worker(){
    while (queue.length){
      const p = queue.shift();
      try { const r = await fetch(p, {cache: 'reload'}); if (!r.ok) throw 0; await c.put(abs(p), r); }
      catch (err) { failed++; }
      done++; show();
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  for (const k of have){ const rel = k.replace(new URL('.', location.href).href, ''); if (rel !== '__files' && !(rel in list.files) && rel !== '' ) await c.delete(k); }
  if (failed){ oStat('<b>Not saved yet</b>' + failed + ' files missing. Open the app on Wi-Fi to finish.'); return; }
  await c.put(abs('__files'), new Response(JSON.stringify(list), {headers: {'Content-Type': 'application/json'}}));
  oStat('<b>Ready offline</b>' + (todo.length && prevR ? 'Updated ' : 'Saved ') + new Date(list.built).toLocaleDateString());
}
function initOffline(){
  if (!OFFLINE_APP || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(offlineSync).catch(() => {});
}

// ---------- Boot ----------
async function boot(){
  try {
    const r = await fetch('data/showcase.json', {cache: 'no-cache'});
    if (r.ok){ const d = await r.json(); if (d && d.rooms && d.meet && d.tours && (d.rev || 0) >= (DATA.rev || 0)) DATA = d; }
  } catch (err) {}
  renderHome(); renderTours();
  window.addEventListener('hashchange', () => route(location.hash.slice(1), true));
  route(location.hash.slice(1) || 'home', true);
  initEdit();
  initOffline();
}
boot();
